# Values para el chart oficial grafana/promtail: DaemonSet que lee
# /var/log/pods/* de cada nodo y envía a Loki. Separado del chart de Loki
# (una Application por responsabilidad, mismo criterio que P8/P9 ya usan
# para no mezclar instalación de infraestructura con configuración).
fullnameOverride: promtail

# BUG real encontrado al instalar contra el clúster real: el chart monta
# /run/promtail como hostPath (directorio del NODO, no un volumen propio
# del Pod) -- en docker-desktop/WSL2 ese directorio del host no es
# escribible por el UID no-root configurado abajo ("error writing
# positions file: permission denied", en bucle). Se mueve el archivo de
# posiciones a un emptyDir propio (/tmp), mismo patrón que ya usan
# gateway/ms-orders/ms-users para su propio /tmp con
# readOnlyRootFilesystem=true.
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

config:
  clients:
    - url: http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push
  positions:
    filename: /tmp/positions.yaml
  snippets:
    # Extrae trace_id y level del log JSON estructurado que escriben los 3
    # servicios instrumentados (ver P10/instrumentation/*/logging.*) y los
    # agrega como labels de Loki -- esto es lo que permite "encontrar un
    # registro desde una traza y una traza desde un registro" sin tener
    # que parsear el JSON a mano en cada consulta.
    pipelineStages:
      - cri: {}
      - json:
          expressions:
            trace_id: trace_id
            level: level
            service: service
      - labels:
          trace_id:
          level:
          service:

# BUG real encontrado al desplegar contra el clúster real: con
# limits.memory=128Mi, promtail corria pegado al limite (121Mi/128Mi,
# ~94%) tailing los logs de TODO el namespace observability -- la
# presion de memoria cercana al limite causaba pausas de GC que hacian
# fallar el timeout de 1s del readinessProbe de forma persistente (9+
# minutos sin pasar, sin reinicios -- no era OOMKill, era lentitud por
# presion de memoria). Mismo patron de causa raiz que el fix de CPU de
# Grafana (ver P10/observability/kube-prometheus-stack/values.yaml).
resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { cpu: 150m, memory: 256Mi }

image:
  tag: "" # PENDIENTE: fijar tag real verificado

# No-root con DAC_READ_SEARCH (en vez de correr como root, que violaría
# disallow-root-user de Kyverno Y es innecesario): esa capability basta
# para leer /var/log/pods de otros contenedores sin ser root. PENDIENTE
# verificar en el clúster real: si el driver de contenedores de
# docker-desktop deja esos logs con permisos que ni DAC_READ_SEARCH
# resuelve, puede requerir ajustar el GID del volumen en vez de esto.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
    add: ["DAC_READ_SEARCH"]
