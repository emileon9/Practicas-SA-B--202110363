# AppProject separado de "sa-platform" (P8/argocd/project/sa-platform-project.yaml)
# a propósito: sa-platform declara explícitamente
# `clusterResourceWhitelist: []` porque su alcance es "desplegar
# microservicios en sa-p5", sin recursos de clúster. El stack de
# observabilidad SÍ necesita recursos de clúster reales (CRDs y RBAC de
# Prometheus Operator) -- mezclar eso en sa-platform ampliaría su alcance
# de forma que contradice su propia descripción. Un AppProject nuevo,
# acotado a lo que realmente necesita, es más honesto que forzar el
# existente.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sa-observability
  namespace: argocd
spec:
  description: >-
    Stack de observabilidad (Práctica 10): Prometheus, Alertmanager,
    Grafana, Loki, Tempo, OpenTelemetry Collector. Namespace dedicado
    "observability", separado de sa-p5.

  sourceRepos:
    - https://github.com/emileon9/Practicas-SA-B--202110363.git
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts

  destinations:
    - namespace: observability
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc

  # A diferencia de sa-platform: SÍ se permiten recursos de clúster, pero
  # acotados exactamente a lo que Prometheus Operator necesita (CRDs +
  # RBAC + webhooks de validación de PrometheusRule) -- no un
  # clusterResourceWhitelist abierto.
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: policy
      kind: PodDisruptionBudget
    - group: argoproj.io
      kind: Application
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: monitoring.coreos.com
      kind: Prometheus
    - group: monitoring.coreos.com
      kind: Alertmanager
