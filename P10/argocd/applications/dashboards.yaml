apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-observability-dashboards
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0" # necesita el namespace "observability" ya creado por kube-prometheus-stack (-1)
spec:
  project: sa-observability
  source:
    repoURL: https://github.com/emileon9/Practicas-SA-B--202110363.git
    targetRevision: master
    path: P10/dashboards
    directory:
      # BUG real encontrado al sincronizar contra el clúster real: sin
      # esto, ArgoCD intenta aplicar gateway-golden-signals.json
      # directamente como si fuera un manifiesto de Kubernetes ("Object
      # 'Kind' is missing") -- ese archivo es solo el dashboard
      # exportado para cumplir el requisito de la practica de "exportar
      # en JSON"; el que de verdad se aplica es configmap.yaml (que lo
      # incrusta).
      exclude: "{gateway-golden-signals.json}"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
