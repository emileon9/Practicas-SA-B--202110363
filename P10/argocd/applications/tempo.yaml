apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-observability-tempo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: sa-observability

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: "1.24.4"
      helm:
        valueFiles:
          - $values/P10/observability/tempo/values.yaml
    - repoURL: https://github.com/emileon9/Practicas-SA-B--202110363.git
      targetRevision: master
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # BUG real encontrado al sincronizar contra el clúster real: el
      # StatefulSet "tempo" ya existia (instalado manualmente en la
      # sesion de prueba anterior) con un campo inmutable distinto del
      # que renderiza ArgoCD -> "updates to statefulset spec ... are
      # forbidden". Replace=true hace que ArgoCD elimine y recree el
      # objeto en vez de intentar un patch -- el PVC no se pierde
      # (reclaimPolicy del StorageClass), solo el Pod se reinicia.
      - Replace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
