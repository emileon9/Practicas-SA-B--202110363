{{/*
El chart crea su propio namespace (Namespace es de los primeros recursos
que Helm aplica en cada instalacion/upgrade, antes que cualquier objeto
namespaced). Por eso "helm install --namespace sa-p5 ..." funciona SIN
"--create-namespace": el propio chart es quien lo crea, no un paso manual.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
