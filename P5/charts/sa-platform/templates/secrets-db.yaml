{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.dbSecretName" . }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "postgresql.auth.password es obligatorio. Copia values.example.yaml a values-secrets.yaml (no versionado) y pasalo con -f, o usa --set postgresql.auth.password=..." .Values.postgresql.auth.password | quote }}
{{- end }}
