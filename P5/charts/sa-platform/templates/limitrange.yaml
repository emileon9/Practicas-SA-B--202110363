{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: sa-platform-limits
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequestCpu | default "50m" | quote }}
        memory: {{ .Values.limitRange.defaultRequestMemory | default "64Mi" | quote }}
      default:
        cpu: {{ .Values.limitRange.defaultLimitCpu | default "250m" | quote }}
        memory: {{ .Values.limitRange.defaultLimitMemory | default "256Mi" | quote }}
{{- end }}
