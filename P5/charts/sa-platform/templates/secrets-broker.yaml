{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sa-platform.brokerSecretName" . }}
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  BROKER_PASSWORD: {{ required "rabbitmq.auth.password es obligatorio. Copia values.example.yaml a values-secrets.yaml (no versionado) y pasalo con -f, o usa --set rabbitmq.auth.password=..." .Values.rabbitmq.auth.password | quote }}
{{- end }}
