apiVersion: v2
name: sa-platform
description: >-
  Plataforma de microservicios de la Practica 4 (USAC - Software Avanzado),
  empaquetada como un unico chart de Helm para la Practica 5: orquestacion
  avanzada en Kubernetes con broker de mensajeria, persistencia durable,
  aislamiento de red y RBAC de minimo privilegio.
type: application
version: 1.1.0
appVersion: "1.1.0"
keywords:
  - microservices
  - kubernetes
  - helm
  - software-avanzado
maintainers:
  - name: 202110363
dependencies:
  - name: postgresql
    version: 18.8.13
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: rabbitmq
    version: 16.0.14
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
  # Subcharts locales (viven directamente en charts/, sin repository: son
  # los microservicios y el gateway de la Practica 4). Se declaran aqui
  # solo para que `helm lint`/`helm dependency list` los reconozcan.
  - name: gateway
    version: 1.0.0
  - name: ms-users
    version: 1.0.0
  - name: ms-products
    version: 1.0.0
  - name: ms-orders
    version: 1.0.0
  - name: ms-notifications
    version: 1.0.0
