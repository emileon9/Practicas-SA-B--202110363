{{/* ServiceAccount dedicado (Queda prohibido el ServiceAccount default) con
     Role/RoleBinding de minimo privilegio: solo puede leer su propio
     ConfigMap, nada mas del API de Kubernetes. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ms-notifications-sa
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "ms-notifications.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ms-notifications-role
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "ms-notifications.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sa-platform-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ms-notifications-rolebinding
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "ms-notifications.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ms-notifications-role
subjects:
  - kind: ServiceAccount
    name: ms-notifications-sa
    namespace: {{ include "sa-platform.namespace" . }}
