# Valores por defecto del subchart. El chart padre (sa-platform) los
# sobrescribe con el bloque "ms-orders:" de sus values.yaml/values-*.yaml.
image:
  repository: sa-platform/ms-orders
  tag: ""
containerPort: 4003
replicaCount: 2
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}
probes:
  startup: {periodSeconds: 5, failureThreshold: 10}
  liveness: {initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 3}
  readiness: {initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
needsDbSecret: false
needsBrokerSecret: false
extraEnv: []
