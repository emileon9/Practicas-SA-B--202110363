apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ms-users-pdb
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "ms-users.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ms-users
