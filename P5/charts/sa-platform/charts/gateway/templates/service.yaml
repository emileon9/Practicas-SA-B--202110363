{{/* ClusterIP unicamente: este microservicio nunca se expone fuera del
     cluster (ni NodePort ni LoadBalancer). Solo el gateway lo alcanza. */}}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
