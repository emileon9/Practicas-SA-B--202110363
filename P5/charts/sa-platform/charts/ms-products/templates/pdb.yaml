apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ms-products-pdb
  namespace: {{ include "sa-platform.namespace" . }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    {{- include "ms-products.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ms-products
