# RabbitMQ para sa-platform.
#
# Se usa la imagen oficial rabbitmq:4.1-management en vez del chart de
# Bitnami: Bitnami retiro sus imagenes publicas de RabbitMQ de Docker Hub y
# ningun tag resuelve ya, ni siquiera "latest".
#
# Igual que PostgreSQL, el broker es infraestructura previa a la aplicacion
# y queda fuera del flujo GitOps de las 7 Applications: se aplica una sola
# vez. La contrasena viene del Secret que descifra el controller de Sealed
# Secrets, nunca en claro aqui.
#
#   kubectl apply -f P8/platform/rabbitmq.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sa-rabbitmq
  namespace: sa-p5
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: sa-platform
spec:
  serviceName: sa-rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: sa-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-management
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: sa_app
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: sa-platform-broker-credentials
                  key: BROKER_PASSWORD
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 10
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: sa-rabbitmq
  namespace: sa-p5
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: sa-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
