# Configuracion para el script de verificacion del auxiliar
# (Fix_Script_p8.sh). Ejecutar el script desde esta carpeta:
#
#   cd P8 && bash Fix_Script_p8.sh
#
# Los valores de abajo son reales y verificados contra el cluster, no
# ejemplos.

CARNET="202110363"
REPO_CODE="https://github.com/emileon9/Practicas-SA-B--202110363"
REPO_GITOPS="https://github.com/emileon9/practica8-gitops"

# Application de ArgoCD que revisa el script. Se usa sa-platform-secrets a
# proposito: el script lee `.spec.source.repoURL` (o `.spec.sources[0]`) y lo
# compara contra el repositorio GitOps. Las Applications de servicio son
# multi-source y su sources[0] es el repositorio de CODIGO (ahi vive el chart
# de Helm), asi que no coincidirian; sa-platform-secrets sincroniza
# directamente desde el repositorio GitOps y si coincide.
APP="sa-platform-secrets"

# Namespace donde viven el Rollout, el AnalysisTemplate y la aplicacion.
NS="sa-p5"

# Imagen firmada a verificar con cosign. Debe ser una imagen realmente
# publicada y firmada por el pipeline (.github/workflows/gitops-update.yml).
IMAGE="ghcr.io/emileon9/sa-platform/gateway:v1.0.0"

# Identidad con la que firma el pipeline (cosign keyless via OIDC de GitHub).
COSIGN_IDENTITY_REGEXP="https://github.com/emileon9/Practicas-SA-B--202110363/.*"
COSIGN_ISSUER="https://token.actions.githubusercontent.com"
