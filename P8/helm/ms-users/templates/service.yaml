{{/* ClusterIP unicamente: este microservicio nunca se expone fuera del
     cluster (ni NodePort ni LoadBalancer). Solo el gateway lo alcanza. */}}
apiVersion: v1
kind: Service
metadata:
  name: ms-users
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ms-users.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: ms-users
  ports:
    - port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
