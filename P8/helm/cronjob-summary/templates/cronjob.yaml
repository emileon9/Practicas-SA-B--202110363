{{/* ServiceAccount dedicado (prohibido el default) con Role de minimo
     privilegio: solo puede leer el ConfigMap compartido no sensible. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-summary-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cronjob-summary.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-summary-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cronjob-summary.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.sharedConfigMapName | default "sa-platform-config" | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-summary-rolebinding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cronjob-summary.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cronjob-summary-role
subjects:
  - kind: ServiceAccount
    name: cronjob-summary-sa
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-summary
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cronjob-summary.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | default "*/10 * * * *" | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit | default 2 }}
      template:
        metadata:
          labels:
            {{- include "cronjob-summary.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cronjob-summary-sa
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runAsUser }}
            runAsGroup: {{ .Values.runAsGroup }}
          containers:
            - name: cronjob-summary
              image: "{{ required "image.repository es obligatorio" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
              envFrom:
                - configMapRef:
                    name: {{ .Values.sharedConfigMapName | default "sa-platform-config" }}
                - secretRef:
                    name: {{ .Values.dbSecretName | default "sa-platform-db-credentials" }}
                - secretRef:
                    name: {{ .Values.brokerSecretName | default "sa-platform-broker-credentials" }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
          volumes:
            - name: tmp
              emptyDir: {}
