# Chart independiente de P8 (antes subchart de P5/charts/sa-platform).
# Valores por defecto; values-dev.yaml / values-prod.yaml sobrescriben lo
# que cambia por ambiente. El tag de imagen se deja vacio a proposito: lo
# inyecta el flujo GitOps (Fase 3), nunca "latest".
namespace: sa-p5
imagePullPolicy: IfNotPresent
sharedConfigMapName: sa-platform-config
dbSecretName: sa-platform-db-credentials
brokerSecretName: sa-platform-broker-credentials
image:
  repository: ghcr.io/emileon9/sa-platform/ms-notifications
  tag: ""
containerPort: 4004
replicaCount: 2
resources:
  requests: {cpu: 50m, memory: 96Mi}
  limits: {cpu: 200m, memory: 192Mi}
probes:
  startup: {periodSeconds: 5, failureThreshold: 12}
  liveness: {initialDelaySeconds: 8, periodSeconds: 10, failureThreshold: 3}
  readiness: {initialDelaySeconds: 3, periodSeconds: 5, failureThreshold: 3}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
# ms-notifications es el consumidor del flujo asincrono: necesita las
# credenciales de PostgreSQL (para guardar el resumen) y de RabbitMQ (para
# consumir la cola durable donde publica el CronJob 2).
needsDbSecret: true
needsBrokerSecret: true
extraEnv: []

runAsUser: 100
runAsGroup: 101
