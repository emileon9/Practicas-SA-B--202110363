{{/*
Sealed Secrets (bitnami/sealed-secrets, antes bitnami-labs/sealed-secrets):
sustituyen a los Secret en texto plano que
P5/charts/sa-platform/templates/secrets-{db,broker}.yaml generaban desde
un values-secrets.yaml local (gitignored, nunca en el repo). Un
SealedSecret SI puede vivir en el repositorio GitOps: el "encryptedData"
es ciphertext, solo el controller de Sealed Secrets corriendo en el
cluster de destino puede descifrarlo (con su propia llave privada, que
nunca sale del cluster).

El "encryptedData" de abajo es REAL: generado con kubeseal contra el
controller instalado en este cluster (namespace kube-system, cluster
docker-desktop), sellando una contraseña generada aleatoriamente que
tambien se aplico a PostgreSQL (sa-postgresql, ver
`helm get values sa-postgresql -n sa-p5`). La contrasena en si nunca se
mostro ni se guardo en este repositorio.

IMPORTANTE: por defecto Sealed Secrets ata el ciphertext al namespace y
nombre exactos del Secret (scope "strict"). Si `.Values.namespace` o
`.Values.secrets.dbSecretName/brokerSecretName` cambian, este
encryptedData deja de ser valido y debe regenerarse:

  kubectl create secret generic sa-platform-db-credentials \
    --namespace sa-p5 --dry-run=client \
    --from-literal=DB_PASSWORD='<password-real>' -o yaml \
    | kubeseal --format yaml --controller-name=sealed-secrets-controller \
        --controller-namespace=kube-system \
    > sealedsecret-db-credentials.yaml

(mismo procedimiento para BROKER_PASSWORD). Ver P8/docs/SECURITY.md.

Pendiente real: BROKER_PASSWORD ya esta sellado, pero RabbitMQ mismo no
esta instalado todavia en este cluster (bitnami/rabbitmq dejo de publicar
imagenes gratuitas en Docker Hub -- ver P8/docs/SECURITY.md). Cuando se
reinstale, debe usar la MISMA contrasena que se selló aqui.
*/}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.dbSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    DB_PASSWORD: 
  template:
    metadata:
      name: {{ .Values.secrets.dbSecretName }}
      namespace: {{ .Values.namespace }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.brokerSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    BROKER_PASSWORD: 
  template:
    metadata:
      name: {{ .Values.secrets.brokerSecretName }}
      namespace: {{ .Values.namespace }}
    type: Opaque
