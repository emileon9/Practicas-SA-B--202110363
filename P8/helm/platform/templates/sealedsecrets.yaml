{{/*
Sealed Secrets (bitnami-labs/sealed-secrets): sustituyen a los Secret en
texto plano que P5/charts/sa-platform/templates/secrets-{db,broker}.yaml
generaban desde un values-secrets.yaml local (gitignored, nunca en el
repo). Un SealedSecret SI puede vivir en el repositorio GitOps: el
"encryptedData" es ciphertext, solo el controller de Sealed Secrets
corriendo en el cluster de destino puede descifrarlo (con su propia llave
privada, que nunca sale del cluster).

Los valores encryptedData.* de abajo son PLACEHOLDERS explicitos, no
credenciales reales. Deben regenerarse por servicio/cluster con:

  kubectl create secret generic sa-platform-db-credentials \
    --namespace sa-p5 --dry-run=client \
    --from-literal=DB_PASSWORD='<password-real>' -o yaml \
    | kubeseal --format yaml --controller-namespace kube-system \
    > sealedsecret-db-credentials.yaml

(mismo procedimiento para BROKER_PASSWORD). Ver P8/docs/SECURITY.md.
*/}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.dbSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    DB_PASSWORD: "PENDIENTE-regenerar-con-kubeseal-ver-docs-SECURITY.md"
  template:
    metadata:
      name: {{ .Values.secrets.dbSecretName }}
      namespace: {{ .Values.namespace }}
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.secrets.brokerSecretName }}
  namespace: {{ .Values.namespace }}
spec:
  encryptedData:
    BROKER_PASSWORD: "PENDIENTE-regenerar-con-kubeseal-ver-docs-SECURITY.md"
  template:
    metadata:
      name: {{ .Values.secrets.brokerSecretName }}
      namespace: {{ .Values.namespace }}
    type: Opaque
