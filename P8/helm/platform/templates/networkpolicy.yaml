{{/*
Mismas reglas de aislamiento que ya existian en
P5/charts/sa-platform/templates/networkpolicy.yaml, reescritas para no
depender de valores de otro chart (cada regla usa los puertos reales y
fijos de cada servicio, documentados en P7/README.md seccion 3).
*/}}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | default "ingress-nginx" }}
      ports:
        - port: 4000
          protocol: TCP
---
{{- range $name, $port := (dict "ms-users" 4001 "ms-products" 4002 "ms-orders" 4003 "ms-notifications" 4004) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      ports:
        - port: {{ $port }}
          protocol: TCP
---
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-postgresql
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ms-notifications
                  - cronjob-heartbeat
                  - cronjob-summary
      ports:
        - port: 5432
          protocol: TCP
---
{{- end }}
{{- if .Values.rabbitmq.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consumers-to-rabbitmq
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sa-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - ms-notifications
                  - cronjob-summary
      ports:
        - port: 5672
          protocol: TCP
{{- end }}
{{- end }}
