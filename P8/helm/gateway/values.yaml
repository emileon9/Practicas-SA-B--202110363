# Chart independiente de P8 (antes subchart de P5/charts/sa-platform).
# Valores por defecto; values-dev.yaml / values-prod.yaml sobrescriben lo
# que cambia por ambiente. El tag de imagen se deja vacio a proposito: lo
# inyecta el flujo GitOps (Fase 3), nunca "latest".
namespace: sa-p5
imagePullPolicy: IfNotPresent
# Nombres de los objetos compartidos (ConfigMap/Secrets) que administra la
# capa de plataforma (P8/helm/platform), no este chart.
sharedConfigMapName: sa-platform-config
dbSecretName: sa-platform-db-credentials
brokerSecretName: sa-platform-broker-credentials
image:
  repository: ghcr.io/emileon9/sa-platform/gateway
  tag: ""
ingress:
  enabled: true
  className: nginx
  host: sa-platform.local
  annotations: {}
containerPort: 4000
replicaCount: 2
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
probes:
  startup: {periodSeconds: 5, failureThreshold: 12}
  liveness: {initialDelaySeconds: 5, periodSeconds: 10, failureThreshold: 3}
  readiness: {initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
needsDbSecret: false
needsBrokerSecret: false
extraEnv:
  - name: USERS_SERVICE_URL
    value: "http://ms-users:4001"
  - name: PRODUCTS_SERVICE_URL
    value: "http://ms-products:4002"
  - name: ORDERS_SERVICE_URL
    value: "http://ms-orders:4003"
  - name: NOTIFICATIONS_SERVICE_URL
    value: "http://ms-notifications:4004"
  # Fallo inducido controlado (Fase 6 / demo de rollback automatico). En 0
  # (este valor base) el comportamiento de /health es identico al de P5/P7;
  # solo el release de demostracion de la version defectuosa lo sobrescribe
  # (ver P8/docs/INCIDENT.md).
  - name: FAULT_INJECT_RATE
    value: "0"

runAsUser: 1000
runAsGroup: 1000

# Umbrales del AnalysisTemplate ejecutado en cada paso del canary
# (analysistemplate.yaml). Ver P8/docs/GITOPS.md para la justificacion de
# estos valores.
canary:
  analysis:
    requests: 20
    maxErrorRatePercent: 10
    maxLatencySeconds: 1
