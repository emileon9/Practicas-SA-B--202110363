{{/* ClusterIP unicamente: este microservicio nunca se expone fuera del
     cluster (ni NodePort ni LoadBalancer). Solo el gateway lo alcanza. */}}
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    # name "http" agregado en Practica 10: lo usa el ServiceMonitor
    # (templates/servicemonitor.yaml) para saber a que puerto scrapear
    # /metrics. No afecta el proxy existente (sigue resolviendo por nombre
    # de Service + numero de puerto, ignora el nombre del puerto).
    - name: http
      port: {{ .Values.containerPort }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP
