{{/*
Gateway es el unico componente de la plataforma desplegado como Rollout de
Argo Rollouts en vez de Deployment: es el punto de entrada externo unico
(ver Ingress en este mismo chart), lo que lo hace el candidato natural para
demostrar entrega progresiva (canary). El resto de los 6 charts siguen
siendo Deployment normales; el mismo patron de este archivo se replica
igual a cualquiera de ellos si se decide extender el canary.

Canary "basico" (sin service mesh): el Service de este chart (ClusterIP,
selector app=gateway) balancea tráfico entre TODOS los pods -- estables y
canary -- proporcional al numero de replicas de cada uno. El
AnalysisTemplate (analysistemplate.yaml) por lo tanto mide el
comportamiento agregado del Service durante cada paso, no trafico aislado
al canary; se documenta esta limitacion en P8/docs/GITOPS.md.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  revisionHistoryLimit: 3
  strategy:
    canary:
      # Tres pasos de promocion (10% -> 30% -> 60%), cada uno seguido del
      # mismo AnalysisTemplate (disponibilidad + tasa de error + latencia de
      # /health). Ningun paso promueve sin que el analisis pase.
      #
      # No hay un "setWeight: 100" final a proposito: al terminar el ultimo
      # paso, Argo Rollouts promueve al 100% y escala a cero la version
      # anterior por si mismo. Dejarlo explicito seria redundante y ademas
      # haria que el ultimo paso NO fuera una compuerta de analisis.
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: gateway-canary-analysis
        - setWeight: 30
        - analysis:
            templates:
              - templateName: gateway-canary-analysis
        - setWeight: 60
        - analysis:
            templates:
              - templateName: gateway-canary-analysis
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
      annotations:
        # Fuerza un rollout cuando cambia cualquier valor de configuracion
        # de este servicio (imagen, recursos, ConfigMap global, etc.).
        checksum/config: {{ toYaml .Values | sha256sum }}
    spec:
      serviceAccountName: gateway-sa
      automountServiceAccountToken: false
      # Anti-afinidad de Pods (Práctica 9). "preferred", no "required":
      # ver justificación en helm/ms-users/templates/deployment.yaml.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
      containers:
        - name: gateway
          image: "{{ required "gateway.image.repository es obligatorio" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.sharedConfigMapName | default "sa-platform-config" }}
            {{- if .Values.needsDbSecret }}
            - secretRef:
                name: {{ .Values.dbSecretName | default "sa-platform-db-credentials" }}
            {{- end }}
            {{- if .Values.needsBrokerSecret }}
            - secretRef:
                name: {{ .Values.brokerSecretName | default "sa-platform-broker-credentials" }}
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem=true requiere un directorio con permiso de
          # escritura para temporales del runtime de Node; se justifica con
          # un emptyDir montado en /tmp (verificado con
          # `docker run --read-only --tmpfs /tmp`, ver docs/security.md).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet: {path: /health, port: {{ .Values.containerPort }}}
            periodSeconds: {{ .Values.probes.startup.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold | default 10 }}
          livenessProbe:
            httpGet: {path: /health, port: {{ .Values.containerPort }}}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds | default 10 }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet: {path: /health, port: {{ .Values.containerPort }}}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds | default 2 }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds | default 5 }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold | default 3 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
