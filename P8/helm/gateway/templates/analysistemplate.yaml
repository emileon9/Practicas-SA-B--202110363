{{/*
Practica 10: reemplaza el AnalysisTemplate de la Practica 8 (provider
"job" + curl sintetico contra /health, ver git log de este archivo para
la version anterior). Este usa el provider "prometheus": en vez de que
Argo Rollouts genere su propio trafico de prueba, consulta el
comportamiento REAL medido del sistema durante el paso del canario
(http_requests_total / http_request_duration_seconds, scrapeados por
P8/helm/gateway/templates/servicemonitor.yaml).

Requiere trafico real fluyendo durante cada paso del canario para tener
señal -- a diferencia del provider "job", que generaba sus propias 20
peticiones. Ver P10/docs/runbook.md, "Prueba de fallo inducido" para el
procedimiento (k6 corriendo en paralelo al rollout).

{{args.canary-hash}} lo rellena Argo Rollouts automaticamente en cada
AnalysisRun (ver rollout.yaml, "valueFrom.podTemplateHashValue: Latest"):
es el pod-template-hash real del ReplicaSet candidato de ESE rollout, no
un valor fijo.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: gateway-canary-analysis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash

  # PENDIENTE verificar el nombre real del Service de Prometheus una vez
  # instalado (depende del nombre exacto que arma el chart
  # kube-prometheus-stack a partir de fullnameOverride): confirmar con
  # `kubectl get svc -n observability | grep prometheus` antes de la demo
  # real. El valor de abajo es el esperado segun el patron del chart con
  # fullnameOverride: kube-prometheus-stack (ver
  # P10/observability/kube-prometheus-stack/values.yaml).
  metrics:
    - name: error-rate
      # Ventana de 2 minutos: suficiente para capturar trafico real de un
      # k6 corriendo durante el paso sin que una rafaga de 1-2 peticiones
      # fallidas dispare un falso positivo.
      interval: 30s
      count: 4
      failureLimit: 0
      successCondition: result[0] <= {{ .Values.canary.analysis.maxErrorRatePercent | default 10 }} / 100.0 || isNaN(result[0])
      # isNaN: si todavia no hay trafico real hacia el Pod candidato en
      # los primeros 30s del paso (0/0), la division da NaN -- se trata
      # como "sin datos aun", no como fallo, para no abortar el canario
      # antes de que el trafico real alcance a los nuevos Pods.
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{route="/health", pod_template_hash="{{ "{{args.canary-hash}}" }}", status_code=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{route="/health", pod_template_hash="{{ "{{args.canary-hash}}" }}"}[2m]))

    - name: p95-latency
      interval: 30s
      count: 4
      failureLimit: 0
      successCondition: result[0] <= {{ .Values.canary.analysis.maxLatencySeconds | default 1 }} || isNaN(result[0])
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
          query: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{pod_template_hash="{{ "{{args.canary-hash}}" }}"}[2m])) by (le)
            )
