# Credenciales selladas (SealedSecret) de PostgreSQL y RabbitMQ.
#
# A diferencia de las otras Applications, esta apunta UNICAMENTE al
# repositorio GitOps: un SealedSecret es estado desplegado, no forma de la
# aplicacion, por lo que no vive en el chart de Helm del repo de codigo.
#
# sync-wave -2: se aplica antes que el chart de plataforma (-1) y que los 7
# charts de servicio (0), porque el controller de Sealed Secrets necesita
# haber descifrado estos SealedSecret en Secret reales antes de que arranque
# cualquier pod que los monte (ms-notifications y los CronJobs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sa-platform-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: sa-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: sa-platform

  source:
    repoURL: https://github.com/emileon9/practica8-gitops.git
    targetRevision: main
    path: secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: sa-p5

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
